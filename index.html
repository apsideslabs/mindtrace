<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MindTrace — Understand people. Understand yourself. A structured learning library for psychology, relationships and human behaviour."
    />
    <meta name="theme-color" content="#080b12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f8fc" media="(prefers-color-scheme: light)" />
    <title>MindTrace — Understand People. Understand Yourself.</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236d7cff'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='white' stroke-width='2.4'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='white'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to content</a>

    <header class="appbar">
      <div class="appbar-inner">
        <a class="brand" href="#/" aria-label="MindTrace home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/></svg>
          </span>
          <span class="brand-name">Mind<span>Trace</span></span>
        </a>

        <nav class="nav" aria-label="Primary">
          <a href="#/learn" data-nav="learn">Learn</a>
          <a href="#/library" data-nav="library">Library</a>
          <a href="#/bookmarks" data-nav="bookmarks">Bookmarks</a>
        </nav>

        <div class="appbar-tools">
          <label class="search" aria-label="Search topics">
            <svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
            <input id="search-input" type="search" placeholder="Search 254 topics…" autocomplete="off" />

            <svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/><circle cx="12" cy="12" r="4"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main id="app" class="app" aria-live="polite"></main>

    <footer class="footer">
      <div class="footer-inner">
        <p>
          <strong>MindTrace</strong> is an educational resource on psychology and human behaviour.
          It is not a diagnostic or clinical tool — for personal or crisis situations, please consult a qualified professional.
        </p>
        <p class="footer-meta">Understand people. Understand yourself.</p>
      </div>
    </footer>

    <script src="assets/data.js"></script>
    <script src="assets/app.js"></script>
  </body>
</html>
